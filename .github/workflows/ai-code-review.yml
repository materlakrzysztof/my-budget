name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  review:
    # Skip re-runs for label events unless the retry label was just added —
    # otherwise every unrelated label add would re-trigger a scoring run.
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    concurrency:
      group: ai-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so the composite action can compute the three-dot
          # diff against origin/<base-ref>.
          fetch-depth: 0

      - uses: ./.github/actions/ai-code-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Mirrors the composite action's own defaults — tuning either value
          # only ever touches this workflow file, never code.
          criterion-floor: "5"
          diff-max-bytes: "200000"
